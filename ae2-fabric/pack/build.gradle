plugins {
    id 'net.fabricmc.fabric-loom'
}

// One jar that contains AE2 and all ported addons as nested jars (Fabric's jar-in-jar). Each mod keeps its own mod
// id, config and data, so worlds are compatible with installing the mods separately.
// ./gradlew :pack:build -> pack/build/libs/ae2-fabric-pack-<version>.jar
version = project.pack_version
group = "appeng"

base {
    archivesName = project.hasProperty("separateTechReborn") ? "ae2-fabric-pack-without-techreborn" : "ae2-fabric-pack"
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "BlameJared"
                url = "https://maven.blamejared.com"
            }
        }
        filter {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "TerraformersMC"
                url = "https://maven.terraformersmc.com/releases"
            }
        }
        filter {
            includeGroup "com.terraformersmc"
        }
    }
}

fabricApi {
    // ./gradlew :pack:prodWorldTest creates a normal world with only the pack installed
    configureTests {
        createSourceSet = true
        modId = "ae2_fabric_pack-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // AE2 (contains GuideME and Team Reborn Energy)
    include project(":")
    // Advanced AE (contains AE2AddonLib) and GeckoLib (MIT), which it needs for the quantum armor
    include project(":advancedae")
    include "maven.modrinth:geckolib:${rootProject.geckolib_version}"
    // ExtendedAE with GlodBlock's library and ae2wtlib
    include project(":glodium")
    include project(":ae2wtlib")
    include project(":extendedae")
    // Applied Flux: energy in storage cells
    include project(":appflux")
    // MEGA Cells: bigger and bulk storage cells, MEGA crafting CPUs, interfaces and pattern providers
    include project(":megacells")
    // Storage Drawers (MIT, official Fabric build); works with the AE2 storage bus through the Fabric transfer API
    include "maven.modrinth:storagedrawers:${rootProject.storagedrawers_version}"
    // Tech Reborn (MIT, contains RebornCore): machines, generators and ore processing; uses the same energy API.
    // -PseparateTechReborn builds the pack without it (it then has to be installed next to the pack), which keeps
    // the jar under 30 MB.
    if (!project.hasProperty("separateTechReborn")) {
        include "maven.modrinth:techreborn:${rootProject.techreborn_version}"
    }
    // Effortless Building (LGPL-3.0): building modes (lines, walls, floors, mirror, array)
    include "maven.modrinth:effortless-building:${rootProject.effortless_building_version}"

    // the pack game tests build AE2 networks
    gametestCompileOnly project(":")
    gametestCompileOnly project(":advancedae")
    gametestCompileOnly project(":ae2addonlib")
    gametestCompileOnly project(":extendedae")
    gametestCompileOnly project(":glodium")
    gametestCompileOnly "maven.modrinth:geckolib:${rootProject.geckolib_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Runs the client game tests of Advanced AE, ExtendedAE and Applied Flux against the bundle, the way players install it:
// ./gradlew :pack:prodClientGameTest
configurations {
    productionRuntimeMods {
        transitive = false
    }
}

dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    productionRuntimeMods fabricApi.module("fabric-client-gametest-api-v1", rootProject.fabric_api_version)
    productionRuntimeMods "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
    productionRuntimeMods "maven.modrinth:jade:${rootProject.jade_version}"
    productionRuntimeMods "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    if (project.hasProperty("separateTechReborn")) {
        productionRuntimeMods "maven.modrinth:techreborn:${rootProject.techreborn_version}"
    }
}

tasks.register("prodClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(tasks.named("jar"))
    mods.from(project(":advancedae").tasks.named("gametestJar"))
    mods.from(project(":extendedae").tasks.named("gametestJar"))
    mods.from(project(":appflux").tasks.named("gametestJar"))
    mods.from(project(":megacells").tasks.named("gametestJar"))
    mods.from(configurations.productionRuntimeMods)
    jvmArgs.add("-Dfabric.client.gametest")
    runDir = layout.buildDirectory.dir("run/prodClientGameTest")
    useXVFB = false
}

// Starts a dedicated server with the bundle: ./gradlew :pack:prodServer
tasks.register("prodServer", net.fabricmc.loom.task.prod.ServerProductionRunTask) {
    mods.from(tasks.named("jar"))
    mods.from(configurations.productionRuntimeMods)
    runDir = layout.buildDirectory.dir("run/prodServer")
}

def packGametestJar = tasks.register("gametestJar", Jar) {
    from sourceSets.gametest.output
    archiveClassifier = "gametest"
}

// Mods that are only installed for the world test (not part of the pack)
configurations {
    worldTestMods {
        transitive = false
    }
}

dependencies {
    // Macaw's Furniture: its kitchen sinks are infinite water sources for AE2 (All Rights Reserved, not bundled)
    worldTestMods "maven.modrinth:macaws-furniture:${rootProject.macaws_furniture_version}"
}

tasks.register("prodWorldTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(tasks.named("jar"))
    mods.from(packGametestJar)
    mods.from(configurations.productionRuntimeMods)
    mods.from(configurations.worldTestMods)
    jvmArgs.add("-Dfabric.client.gametest")
    runDir = layout.buildDirectory.dir("run/prodWorldTest")
    useXVFB = false
}

// The pack's client tests with Sodium and Iris, like many players have them, optionally with an Iris shader pack:
// ./gradlew :pack:prodShaderTest [-PshaderPack=<zip>]
configurations {
    shaderTestMods {
        transitive = false
    }
}

dependencies {
    shaderTestMods "maven.modrinth:sodium:${rootProject.sodium_version}"
    shaderTestMods "maven.modrinth:iris:${rootProject.iris_version}"
}

tasks.register("prodShaderTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    mods.from(tasks.named("jar"))
    mods.from(packGametestJar)
    mods.from(configurations.productionRuntimeMods)
    mods.from(configurations.worldTestMods)
    mods.from(configurations.shaderTestMods)
    jvmArgs.add("-Dfabric.client.gametest")
    def shaderRunDir = layout.buildDirectory.dir("run/prodShaderTest")
    def shaderPack = project.findProperty("shaderPack")
    runDir = shaderRunDir
    useXVFB = false
    doFirst {
        def dir = shaderRunDir.get().asFile
        def config = new File(dir, "config/iris.properties")
        config.parentFile.mkdirs()
        if (shaderPack != null) {
            def pack = file(shaderPack)
            copy {
                from pack
                into new File(dir, "shaderpacks")
            }
            config.text = "enableShaders=true\nshaderPack=${pack.name}\n"
        } else {
            config.text = "enableShaders=false\n"
        }
    }
}
