plugins {
    id 'net.fabricmc.fabric-loom'
}

// Fabric port of Oritech (https://github.com/Rearth/Oritech, branch 26.1), a technology mod with machines,
// multiblocks, energy, fluids and processing chains. Oritech is licensed under CC0-1.0, see LICENSE.md.
version = project.oritech_version
group = "rearth.oritech"

base {
    archivesName = "oritech-fabric"
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "BlameJared"
                url = "https://maven.blamejared.com"
            }
        }
        filter {
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "TerraformersMC"
                url = "https://maven.terraformersmc.com/releases"
            }
        }
        filter {
            includeGroup "com.terraformersmc"
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir "src/generated/resources"
            exclude ".cache/**"
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/oritech.classtweaker")
}

fabricApi {
    // The client game test (src/gametest): ./gradlew :oritech:runClientGameTest
    configureTests {
        createSourceSet = true
        modId = "oritech-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    // Forge Energy on NeoForge, Team Reborn Energy on Fabric
    implementation "teamreborn:energy:${rootProject.tr_energy_version}"
    include "teamreborn:energy:${rootProject.tr_energy_version}"

    // GeckoLib (MIT): animated machines, armor and tools
    implementation "maven.modrinth:geckolib:${rootProject.geckolib_version}"

    compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-common-api:${rootProject.jei_version}"
    compileOnly "mezz.jei:jei-${rootProject.minecraft_version}-fabric-api:${rootProject.jei_version}"
    localRuntime "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
    compileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    localRuntime "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
}

processResources {
    // hand-written resources in src/main win over the generated ones
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xmaxerrs", "100000"]
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE.md") {
        rename { "LICENSE_oritech.md" }
    }
}

// The client game test as a jar, so it can also run against the bundle
def gametestJar = tasks.register("gametestJar", Jar) {
    from sourceSets.gametest.output
    archiveClassifier = "gametest"
}
